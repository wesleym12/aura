name: aura

# Base comum (Windows, Linux, umbrelOS). Partes opcionais entram pelo COMPOSE_FILE / COMPOSE_PROFILES do .env,
# que o instalador (instalar.ps1 / instalar.sh) preenche conforme o computador:
#   docker-compose.gpu.yml      placa NVIDIA para o modelo local
#   docker-compose.windows.yml  "Iniciar com o Windows"
#   docker-compose.linux.yml    metricas do servidor Linux
#   COMPOSE_PROFILES=casa       Home Assistant junto (deixe de fora se ja tiver um, como o app do Umbrel)

services:
  # Modelo local (na CPU; com docker-compose.gpu.yml, na placa NVIDIA)
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=30m
      - OLLAMA_CONTEXT_LENGTH=${OLLAMA_CONTEXT_LENGTH:-8192}   # cabe o prompt + ~25 ferramentas
      # memoria: 1 conversa por vez, cache de contexto em 8 bits e no maximo 2 modelos carregados
      - OLLAMA_NUM_PARALLEL=1
      - OLLAMA_FLASH_ATTENTION=1
      - OLLAMA_KV_CACHE_TYPE=q8_0
      - OLLAMA_MAX_LOADED_MODELS=2
      # copia de prompts em RAM do llama-server: o padrao (8 GB) estourava a memoria; 1 GB guarda o prompt do chat
      - LLAMA_ARG_CACHE_RAM=1024
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  # Baixa os modelos na primeira subida (depois so confere e sai). O de busca na memoria sempre (pequeno);
  # o de conversa e o de visao so no modo local (AURA_LOCAL_LLM=1).
  ollama-pull:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      - OLLAMA_HOST=ollama:11434
    entrypoint: ["sh", "-c", "ollama pull ${EMBED_MODEL:-paraphrase-multilingual} && if [ '${AURA_LOCAL_LLM:-1}' != '0' ]; then ollama pull ${OLLAMA_MODEL:-qwen3:4b-instruct} && ollama pull ${VISION_MODEL:-qwen3-vl:2b-instruct}; fi"]
    restart: "no"

  aura:
    build: .
    ports:
      - "${AURA_BIND:-127.0.0.1}:8765:8765"   # 127.0.0.1 = so nesta maquina; 0.0.0.0 = rede (exige AURA_PASSWORD)
    environment:
      - TZ=${TZ:-America/Sao_Paulo}
      - OLLAMA_URL=http://ollama:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen3:4b-instruct}
      - EMBED_MODEL=${EMBED_MODEL:-paraphrase-multilingual}
      - VISION_MODEL=${VISION_MODEL:-qwen3-vl:2b-instruct}        # le imagens e PDFs escaneados (local)
      - AURA_LOCAL_LLM=${AURA_LOCAL_LLM:-1}         # 0 = "so Gemini": o cerebro e o Gemini (o Ollama so faz a busca na memoria)
      - AGENT_TIMEOUT=${AGENT_TIMEOUT:-600}
      - CLAUDE_CODE_OAUTH_TOKEN=${CLAUDE_CODE_OAUTH_TOKEN:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_LIVE_MODEL=${GEMINI_LIVE_MODEL:-gemini-3.1-flash-live-preview}
      - HOST_AGENT_TOKEN=${HOST_AGENT_TOKEN:-}          # o agente do Windows se identifica com esta chave
      - HOST_ROOT_WIN=${WORK_ROOT:-}                    # para mostrar os caminhos como no computador
      - AURA_DIR_WIN=${AURA_DIR_WIN:-}                  # pasta do projeto no Windows (vazio = descobre sozinho)
      - AURA_POWER_DRYRUN=${AURA_POWER_DRYRUN:-0}       # 1 = simula desligar/reiniciar/Wi-Fi
      # acesso pela rede (servidor Linux/umbrelOS): senha, HTTPS e o endereco usado nos logins (Spotify)
      - AURA_PASSWORD=${AURA_PASSWORD:-}
      - AURA_TLS=${AURA_TLS:-0}
      - AURA_TLS_NAMES=${AURA_TLS_NAMES:-}
      - AURA_PUBLIC_URL=${AURA_PUBLIC_URL:-}
      - AURA_ALLOWED_HOSTS=${AURA_ALLOWED_HOSTS:-}
    volumes:
      - aura-data:/data
      - ./workspace:/workspace          # pasta de trabalho padrao (visivel no computador)
      - ./aura/web:/app/aura/web:ro     # edicao ao vivo da interface (F5 para ver)
      - ./plugins:/app/plugins          # plugins: um .py aqui = habilidade nova
      - ${WORK_ROOT:-./workspace}:/host # sua pasta de usuario: dentro dela voce escolhe a pasta de trabalho
      - ./backups:/backups              # backups do banco (conversas, memoria...)
      - ./memoria:/memoria              # INSTRUCOES.md, SOBRE-MIM.md e skills/
      - claude-auth:/home/node/.claude  # login do Claude Code
      - codex-auth:/home/node/.codex    # login do Codex
      - tool-cache:/home/node/.cache    # servidores MCP baixados pelo uvx
      - npm-cache:/home/node/.npm       # idem para os do npx
    depends_on:
      ollama:
        condition: service_healthy
    restart: unless-stopped

  # Casa inteligente: Home Assistant junto (perfil "casa"). Quem ja tem um HA (ex.: o app do umbrelOS) deixa de
  # fora e conecta o dele em Plugins -> Casa inteligente -> "Usar outro Home Assistant".
  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    profiles: ["casa"]
    ports:
      - "${AURA_BIND:-127.0.0.1}:8123:8123"
    environment:
      - TZ=${TZ:-America/Sao_Paulo}
    volumes:
      - homeassistant:/config
    restart: unless-stopped

  # Voz: palavra de ativacao + Whisper (transcricao) + Kokoro/Piper (fala). Roda na CPU.
  # A tela fala com ele atraves da A.U.R.A. (/voice), entao nao precisa de porta propria.
  voice:
    build:
      context: ./voice
      args:
        WHISPER_MODEL: ${WHISPER_MODEL:-small}   # o modelo ja vem dentro da imagem (funciona sem internet)
    environment:
      - TZ=${TZ:-America/Sao_Paulo}
      - WHISPER_MODEL=${WHISPER_MODEL:-small}
      - TTS_VOICE=${TTS_VOICE:-pf_dora}
    volumes:
      - piper-voices:/models/piper   # vozes do Piper baixadas sob demanda (outras linguas)
    restart: unless-stopped

volumes:
  homeassistant:
  piper-voices:
  ollama:
  aura-data:
  claude-auth:
  codex-auth:
  tool-cache:
  npm-cache:
