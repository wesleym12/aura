# So no Linux (desktop ou servidor): deixa a A.U.R.A. medir a maquina inteira (CPU, RAM, temperatura, rede)
# para o painel do topo. Somente leitura. Entra pelo COMPOSE_FILE do .env (o instalar.sh coloca sozinho).
services:
  aura:
    volumes:
      - /proc:/host_proc:ro
      - /etc/os-release:/host_os_release:ro
